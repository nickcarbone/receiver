<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="no">
<meta name="theme-color" content="#1b1e21">
<title>Receiver</title>
<style>
  :root{
    --shell:#1b1e21;
    --panel:#252a2e;
    --panel-hi:#2f353a;
    --slat:#3a4046;
    --etch:#8d959c;
    --readout:#e8e4dc;
    --lamp:#d9a441;
    --hair:rgba(255,255,255,.07);
    --dead:#5a6167;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--shell);
    color:var(--readout);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select{font:inherit}

  /* ---------- cabinet ---------- */
  .cabinet{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(#2f353a,#22272b 62%,#1d2124);
    border-bottom:1px solid #14171a;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 8px 22px rgba(0,0,0,.45);
    padding:calc(10px + env(safe-area-inset-top)) 14px 12px;
  }
  .cab-row{display:flex;align-items:center;gap:13px}

  /* porthole */
  .porthole{
    flex:0 0 92px;height:92px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#33393e,#1a1d20 72%);
    box-shadow:
      0 0 0 2px #4a5157,
      0 0 0 3px #16191b,
      inset 0 3px 9px rgba(0,0,0,.75),
      inset 0 -2px 5px rgba(255,255,255,.05);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:8px;overflow:hidden;position:relative;
  }
  .p-freq{
    font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.08em;color:var(--etch);
  }
  .p-name{
    font:600 13px/1.15 -apple-system,sans-serif;
    color:var(--readout);margin-top:5px;max-width:76px;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .lamp{
    width:6px;height:6px;border-radius:50%;background:#3d4348;margin-top:6px;
    transition:background .25s, box-shadow .25s;
  }
  .lamp.on{background:var(--lamp);box-shadow:0 0 7px 1px rgba(217,164,65,.75)}
  .lamp.warm{background:#7a6234}

  /* grille */
  .grille{
    flex:1;height:92px;border-radius:5px;overflow:hidden;
    display:flex;gap:3px;align-items:flex-end;padding:7px 8px;
    background:linear-gradient(#1c2023,#15181a);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.05);
  }
  .slat{
    flex:1;height:26%;background:var(--slat);border-radius:1px;
    transform:skewX(-13deg);transform-origin:bottom;
    transition:height .34s cubic-bezier(.3,.7,.3,1), background .34s;
  }
  .playing .slat{background:#4b535a}

  .cab-meta{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:9px;font-size:12px;color:var(--etch);gap:10px;
  }
  .cab-meta b{font-weight:500;color:#aab2b8}
  .stopbtn{
    color:var(--etch);border:1px solid var(--hair);border-radius:20px;
    padding:3px 12px;font-size:12px;
  }
  .stopbtn:active{background:rgba(255,255,255,.06)}

  /* ---------- controls ---------- */
  .chips{
    display:flex;gap:7px;overflow-x:auto;padding:11px 14px 4px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;padding:6px 13px;border-radius:16px;font-size:13px;
    color:var(--etch);border:1px solid var(--hair);background:rgba(255,255,255,.02);
  }
  .chip[aria-pressed="true"]{color:#141719;background:var(--readout);border-color:var(--readout);font-weight:600}

  .searchwrap{padding:8px 14px 2px}
  .search{
    width:100%;padding:9px 12px;border-radius:8px;
    background:#171a1d;border:1px solid var(--hair);color:var(--readout);
  }
  .search::placeholder{color:#5f676d}

  /* ---------- list ---------- */
  .list{padding:8px 10px 32px;display:flex;flex-direction:column;gap:6px}
  .st{
    display:flex;align-items:center;gap:11px;
    padding:11px 12px;border-radius:9px;
    background:var(--panel);border:1px solid var(--hair);
    text-align:left;width:100%;
  }
  .st:active{background:var(--panel-hi)}
  .st.live{border-color:rgba(217,164,65,.5);background:#2c3136}
  .st-body{flex:1;min-width:0}
  .st-name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px}
  .st-sub{font-size:12.5px;color:var(--etch);margin-top:2px}
  .st-note{font-size:12px;color:#8a7c56;margin-top:4px;line-height:1.35}
  .st-act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .fav{font-size:16px;line-height:1;color:#464d53;padding:2px 4px}
  .fav.on{color:var(--lamp)}
  .out{
    font-size:11.5px;color:var(--etch);border:1px solid var(--hair);
    border-radius:14px;padding:4px 9px;text-decoration:none;white-space:nowrap;
  }
  .tag{
    font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;
    padding:3px 5px;border-radius:3px;background:#3a4046;color:#c3cad0;
  }
  .tag.warn{background:#4a3f22;color:#d9bd7c}
  .st.blocked .st-name{color:var(--dead)}

  .empty{padding:34px 20px;text-align:center;color:var(--etch);font-size:14px}

  /* ---------- drawer ---------- */
  .bar{
    display:flex;gap:8px;padding:4px 14px 26px;justify-content:center;flex-wrap:wrap;
  }
  .bar button{
    font-size:12.5px;color:var(--etch);border:1px solid var(--hair);
    border-radius:16px;padding:6px 13px;
  }
  dialog{
    border:0;border-radius:14px 14px 0 0;padding:0;width:100%;max-width:520px;
    background:var(--panel);color:var(--readout);margin:auto auto 0;
  }
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .sheet{padding:18px 18px calc(20px + env(safe-area-inset-bottom))}
  .sheet h2{font-size:16px;margin:0 0 3px}
  .sheet p{font-size:12.5px;color:var(--etch);margin:0 0 14px}
  .f{display:block;margin-bottom:10px}
  .f span{display:block;font-size:12px;color:var(--etch);margin-bottom:4px}
  .f input,.f select{
    width:100%;padding:9px 11px;border-radius:8px;
    background:#171a1d;border:1px solid var(--hair);color:var(--readout);
  }
  .sheet-act{display:flex;gap:9px;margin-top:14px}
  .sheet-act button{flex:1;padding:11px;border-radius:9px;font-weight:600;font-size:14px}
  .save{background:var(--readout);color:#171a1d}
  .cancel{border:1px solid var(--hair);color:var(--etch)}
  .msg{font-size:12.5px;color:var(--lamp);min-height:17px;margin-top:8px}

  @media (prefers-reduced-motion:reduce){.slat{transition:none}}
</style>
</head>
<body>

<div class="cabinet" id="cab">
  <div class="cab-row">
    <div class="porthole">
      <div class="p-freq" id="pFreq">OFF</div>
      <div class="p-name" id="pName">standby</div>
      <div class="lamp" id="lamp"></div>
    </div>
    <div class="grille" id="grille"></div>
  </div>
  <div class="cab-meta">
    <div id="status">Pick a station.</div>
    <button class="stopbtn" id="stop" hidden>Stop</button>
  </div>
</div>

<div class="chips" id="chips"></div>
<div class="searchwrap"><input class="search" id="search" placeholder="Search stations" autocomplete="off" autocapitalize="off"></div>
<div class="list" id="list"></div>

<div class="bar">
  <button id="addBtn">Add a station</button>
  <button id="expBtn">Export library</button>
  <button id="impBtn">Import library</button>
</div>

<dialog id="sheet"><div class="sheet">
  <h2 id="shTitle">Add a station</h2>
  <p>Paste a direct stream URL — an Icecast/Shoutcast mount or an .m3u8. A homepage link won't play.</p>
  <label class="f"><span>Name</span><input id="fName" placeholder="Radio Nova"></label>
  <label class="f"><span>Stream URL</span><input id="fUrl" placeholder="https://…" inputmode="url" autocapitalize="off"></label>
  <label class="f"><span>Where to listen on the web (optional)</span><input id="fSite" placeholder="https://…" inputmode="url" autocapitalize="off"></label>
  <label class="f"><span>City and country</span><input id="fPlace" placeholder="Paris, France"></label>
  <label class="f"><span>Bucket</span><select id="fCat"></select></label>
  <div class="msg" id="fMsg"></div>
  <div class="sheet-act">
    <button class="cancel" id="fCancel">Cancel</button>
    <button class="save" id="fSave">Save station</button>
  </div>
  <div class="sheet-act" id="delRow" hidden style="margin-top:9px">
    <button class="cancel" id="fDelete" style="color:#c98080">Remove this station</button>
  </div>
</div></dialog>

<dialog id="ioSheet"><div class="sheet">
  <h2 id="ioTitle">Library</h2>
  <p id="ioHelp"></p>
  <label class="f"><textarea id="ioText" rows="9" style="width:100%;padding:9px;border-radius:8px;background:#171a1d;border:1px solid var(--hair);color:var(--readout);font:12px/1.4 ui-monospace,Menlo,monospace"></textarea></label>
  <div class="msg" id="ioMsg"></div>
  <div class="sheet-act">
    <button class="cancel" id="ioClose">Close</button>
    <button class="save" id="ioGo" hidden>Import</button>
  </div>
</div></dialog>

<script>
/* ============================================================
   Receiver — mobile
   Static page. No server, so no ICY metadata: the readout shows
   station identity, not the current track. Every stream URL below
   was probed live (status, content-type, icy-name) rather than
   assumed. Notes record what failed and why.
   ============================================================ */

const BUILT = [

  {id:"bfbscyp", n:"BFBS Cyprus", cat:"Forces", place:"Cyprus",

  {id:"bfbsbeats", n:"BFBS Beats", cat:"Forces", place:"Dance stream",

  // ---- Rock ----
  {id:"stubru", n:"VRT Studio Brussel", cat:"Rock", place:"Brussels, Belgium",
   url:"https://icecast.vrtcdn.be/stubru-high.mp3", site:"https://www.vrt.be/vrtmax/kanalen/stubru/"},
  {id:"srf3", n:"SRF 3", cat:"Rock", place:"Zurich, Switzerland",
   url:"https://stream.srg-ssr.ch/srgssr/srf3/aac/192", site:"https://www.srf.ch/radio-srf-3",
   note:"Use this AAC mount, not the mp3_128 one — that redirects to plain http and Safari blocks it."},
  {id:"1live", n:"1LIVE", cat:"Rock", place:"Cologne, Germany",
   url:"https://wdr-1live-live.icecastssl.wdr.de/wdr/1live/live/mp3/128/stream.mp3",
   site:"https://www1.wdr.de/radio/1live/",
   note:"WDR blocks datacenter IPs — returns 403 from a cloud probe. Should open fine from a home or phone connection."},
  {id:"kerrang", n:"Kerrang!", cat:"Rock", place:"London, UK",
   url:"https://stream-al.hellorayo.co.uk/kerrang.aac?direct=true",
   site:"https://www.hellorayo.co.uk/kerrang",
   note:"Geo-fenced to the UK. Returns HTTP 500 from anywhere else, including here."},

  // ---- Top 40 ----
  {id:"anr", n:"ANR", cat:"Top 40", place:"Aabenraa, Denmark",
   url:"https://stream.anr.dk/anr", site:"https://www.anr.dk/"},
  {id:"bay897", n:"89.7 Bay", cat:"Top 40", place:"Malta",
   url:"https://stream.v3.network/proxy/897bay/stream.mp3", site:"https://bay.com.mt/"},
  {id:"riviera", n:"Riviera Radio", cat:"Top 40", place:"Monaco",
   url:"https://media-ssl.musicradio.com/RivieraRadio", site:"https://rivieraradio.mc/"},
  {id:"nrj", n:"NRJ", cat:"Top 40", place:"Paris, France",
   url:"https://streaming.nrjaudio.fm/ou5k6tirv93h", site:"https://www.nrj.fr/player"},
  {id:"radio538", n:"Radio 538", cat:"Top 40", place:"Amsterdam, Netherlands",
   url:"https://playerservices.streamtheworld.com/api/livestream-redirect/RADIO538.mp3",
   site:"https://www.538.nl/luister-live"},
  {id:"zoo", n:"Zoo Radio 90.8", cat:"Top 40", place:"Thessaloniki, Greece",
   url:"https://metromedia.live24.gr/zoo908thess", site:"https://www.zooradio.gr/"},
  {id:"otvoreni", n:"Otvoreni", cat:"Top 40", place:"Zagreb, Croatia",
   url:"https://stream.otvoreni.hr/otvoreni", site:"https://www.otvoreni.hr/"},
  {id:"antena", n:"Antena Sarajevo", cat:"Top 40", place:"Sarajevo, Bosnia",
   url:"https://stream.rsgmedia.ba/listen/antena_sarajevo/radio.mp3", site:"https://radio.antena.ba/"},
  {id:"eldo", n:"Eldoradio", cat:"Top 40", place:"Luxembourg City",
   url:"https://sc.bce.lu/eldo", site:"https://www.eldo.lu/"},
  {id:"bigfm", n:"bigFM", cat:"Top 40", place:"Stuttgart, Germany",
   url:"https://stream.bigfm.de/deutschland/mp3-128/radio-browser", site:"https://www.bigfm.de/webradio"},
  {id:"evropa2", n:"Evropa 2", cat:"Top 40", place:"Prague, Czechia",
   url:"https://playerservices.streamtheworld.com/api/livestream-redirect/EVROPA2AAC.aac",
   site:"https://www.evropa2.cz/"},
  {id:"p3se", n:"P3", cat:"Top 40", place:"Stockholm, Sweden",
   url:"https://live1.sr.se/p3-mp3-96", site:"https://sverigesradio.se/p3"},
  {id:"radio1hu", n:"Rádió 1", cat:"Top 40", place:"Budapest, Hungary",
   url:"https://icast.connectmedia.hu/5201/live.mp3", site:"https://www.radio1.hu/"},
  {id:"drp3", n:"DR P3", cat:"Top 40", place:"Copenhagen, Denmark",
   url:"https://drliveradio2.akamaized.net/hls/live/2118698/drlydekstra/masterab.m3u8", hls:true,
   site:"https://www.dr.dk/lyd/p3"},
  {id:"deejay", n:"Radio Deejay", cat:"Top 40", place:"Milan, Italy",
   url:"https://StreamCdnC1-4c4b867c89244861ac216426883d1ad0.msvdn.net/radiodeejay/radiodeejay/master_ma.m3u8",
   hls:true, site:"https://www.deejay.it/dirette/radiodeejay/"},
  {id:"star941", n:"Star 94.1", cat:"Top 40", place:"San Diego, USA",
   url:"https://stream.revma.ihrhls.com/zc253/hls.m3u8", hls:true,
   site:"https://www.iheart.com/live/star-941-253/"},
  {id:"dasding", n:"DASDING", cat:"Top 40", place:"Baden-Baden, Germany",
   url:"https://liveradio.swr.de/d245tgd/dasding/", site:"https://www.dasding.de/livestream",
   note:"SWR blocks datacenter IPs — 403 from a cloud probe, fine from home."},
  {id:"youfm", n:"YOU FM", cat:"Top 40", place:"Frankfurt, Germany",
   url:"https://dispatcher.rndfnk.com/hr/youfm/live/mp3/high", site:"https://www.youfm.de/",
   note:"Plays, but hr labels this mount 'DASDING vom hr' in its ICY header. The path is hr's own YOU FM one, so the label looks like their mistake, not a wrong stream. Worth a listen to confirm."},
  {id:"ffh", n:"Hit Radio FFH", cat:"Top 40", place:"Bad Vilbel, Germany",
   url:"https://mp3.ffh.de/radioffh/hqlivestream.aac", site:"https://www.ffh.de/webradio",
   note:"403 from a cloud probe, same datacenter-block pattern as the other German broadcasters."},

  // ---- HTTP only: will not play on an https-hosted page ----
  {id:"fm957", n:"FM957", cat:"Top 40", place:"Reykjavik, Iceland",
   url:"http://icecast.365net.is:8000/orbFm957.aac", site:"https://www.visir.is/k/fm957",
   note:"Sýn's Icecast has no https and no HLS sibling. Blocked on an https page; the link out is the way in."},
  {id:"bylgjan", n:"Bylgjan", cat:"Top 40", place:"Reykjavik, Iceland",
   url:"http://icecast.365net.is:8000/orbbylgjan.aac", site:"https://bylgjan.visir.is/",
   note:"Same Icelandic Icecast, same http-only limitation."},
  {id:"k100", n:"K100", cat:"Top 40", place:"Reykjavik, Iceland",
   url:"", site:"https://k100.mbl.is/",
   note:"No public stream URL found. mbl.is sits behind a bot challenge and isn't in Radio Browser. Link out only until you capture the mount from Safari's network inspector."}
];

const CATS = ["Talk","Rock","Top 40","Forces","Other"];
const KEY = "receiver.v1";
const SLATS = 22;

/* ---------- storage, with graceful failure ---------- */
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};
let state = {custom:[], fav:[], hidden:[], last:null};
try{ Object.assign(state, JSON.parse(store.get(KEY) || "{}")); }catch(e){}
const save = () => store.set(KEY, JSON.stringify(state));

/* ---------- derived library ---------- */
const httpsPage = location.protocol === "https:";
function library(){
  const built = BUILT.filter(s => !state.hidden.includes(s.id));
  return built.concat(state.custom);
}
function insecure(s){ return httpsPage && s.url && s.url.startsWith("http://"); }
function playable(s){ return !!s.url && !insecure(s); }

/* ---------- elements ---------- */
const $ = s => document.querySelector(s);
const listEl = $("#list"), chipsEl = $("#chips"), grille = $("#grille");
const pFreq = $("#pFreq"), pName = $("#pName"), lamp = $("#lamp"),
      statusEl = $("#status"), stopBtn = $("#stop");

for(let i=0;i<SLATS;i++){ const d=document.createElement("div"); d.className="slat"; grille.appendChild(d); }
const slats = [...document.querySelectorAll(".slat")];

/* ---------- audio ---------- */
const audio = new Audio();
audio.preload = "none";
let current = null, tries = 0, retryTimer = null, animTimer = null, hls = null;

function setReadout(freq, name, lampState, status){
  pFreq.textContent = freq;
  pName.textContent = name;
  lamp.className = "lamp" + (lampState ? " " + lampState : "");
  statusEl.textContent = status;
  stopBtn.hidden = !current;
}

function animate(on){
  clearInterval(animTimer);
  document.body.classList.toggle("playing", on);
  if(!on){ slats.forEach(s => s.style.height = "26%"); return; }
  animTimer = setInterval(() => {
    slats.forEach((s,i) => {
      const base = 34 + 30*Math.sin((Date.now()/380) + i*0.7);
      s.style.height = Math.max(18, Math.min(96, base + Math.random()*26)) + "%";
    });
  }, 190);
}

async function tune(s){
  if(current && current.id === s.id){ stop(); return; }
  stop(true);
  current = s; tries = 0;
  state.last = s.id; save();
  render();
  setReadout("TUNING", s.n, "warm", "Connecting to " + s.n + "…");
  await connect();
}

async function connect(){
  const s = current; if(!s) return;
  const native = audio.canPlayType("application/vnd.apple.mpegurl") !== "";
  try{
    if(s.hls && !native){
      await loadHls();
      if(hls) hls.destroy();
      hls = new Hls(); hls.loadSource(s.url); hls.attachMedia(audio);
    }else{
      audio.src = s.url;
    }
    await audio.play();
    onLive();
  }catch(err){
    onFail(err);
  }
}

function loadHls(){
  if(window.Hls) return Promise.resolve();
  return new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js";
    sc.onload = res; sc.onerror = rej;
    document.head.appendChild(sc);
  });
}

function onLive(){
  const s = current; if(!s) return;
  tries = 0;
  setReadout("ON AIR", s.n, "on", s.place);
  animate(true);
  if("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.n, artist: s.place, album: "Receiver"
    });
    navigator.mediaSession.playbackState = "playing";
  }
  render();
}

function onFail(){
  const s = current; if(!s) return;
  tries++;
  animate(false);
  if(tries <= 4){
    setReadout("RETRY", s.n, "warm", "Stream dropped. Retry " + tries + " of 4…");
    retryTimer = setTimeout(connect, 900 * tries);
  }else{
    setReadout("NO SIG", s.n, "", "Couldn't hold " + s.n + ". Try the listen page.");
    current = null; render();
  }
}

function stop(quiet){
  clearTimeout(retryTimer);
  try{ audio.pause(); audio.removeAttribute("src"); audio.load(); }catch(e){}
  if(hls){ hls.destroy(); hls = null; }
  current = null; animate(false);
  if("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
  if(!quiet){ setReadout("OFF","standby","","Pick a station."); render(); }
}

audio.addEventListener("error", onFail);
audio.addEventListener("ended", () => { if(current) onFail(); });
audio.addEventListener("playing", () => { if(current) onLive(); });

if("mediaSession" in navigator){
  try{
    navigator.mediaSession.setActionHandler("play", () => current && audio.play());
    navigator.mediaSession.setActionHandler("pause", () => stop());
    navigator.mediaSession.setActionHandler("stop", () => stop());
  }catch(e){}
}
stopBtn.onclick = () => stop();

/* ---------- rendering ---------- */
let filter = "All", query = "";

function renderChips(){
  const present = [...new Set(library().map(s => s.cat))];
  const order = ["All", ...CATS.filter(c => present.includes(c)), "Saved"];
  chipsEl.innerHTML = order.map(c =>
    `<button class="chip" data-c="${c}" aria-pressed="${c===filter}">${c}</button>`).join("");
}

function render(){
  renderChips();
  let rows = library();
  if(filter === "Saved") rows = rows.filter(s => state.fav.includes(s.id));
  else if(filter !== "All") rows = rows.filter(s => s.cat === filter);
  if(query){
    const q = query.toLowerCase();
    rows = rows.filter(s => (s.n + " " + s.place + " " + s.cat).toLowerCase().includes(q));
  }
  rows.sort((a,b) => {
    const fa = state.fav.includes(a.id), fb = state.fav.includes(b.id);
    if(fa !== fb) return fa ? -1 : 1;
    return a.n.localeCompare(b.n);
  });

  if(!rows.length){
    listEl.innerHTML = `<div class="empty">Nothing here yet. Add a station and it'll stay on this phone.</div>`;
    return;
  }

  listEl.innerHTML = rows.map(s => {
    const live = current && current.id === s.id;
    const can = playable(s);
    const tags = [];
    if(s.hls) tags.push(`<span class="tag">HLS</span>`);
    if(insecure(s)) tags.push(`<span class="tag warn">HTTP</span>`);
    if(!s.url) tags.push(`<span class="tag warn">NO URL</span>`);
    if(s.custom) tags.push(`<span class="tag">MINE</span>`);
    const note = !can && s.note ? `<div class="st-note">${esc(s.note)}</div>` : "";
    return `
      <div class="st ${live?"live":""} ${can?"":"blocked"}">
        <div class="st-body" data-play="${s.id}" role="button" tabindex="0">
          <div class="st-name">${esc(s.n)} ${tags.join(" ")}</div>
          <div class="st-sub">${esc(s.place)} · ${esc(s.cat)}</div>
          ${note}
        </div>
        <div class="st-act">
          <button class="fav ${state.fav.includes(s.id)?"on":""}" data-fav="${s.id}" aria-label="Save">★</button>
          ${s.site ? `<a class="out" href="${s.site}" target="_blank" rel="noopener">Listen page</a>` : ""}
          ${s.custom ? `<button class="out" data-edit="${s.id}">Edit</button>` : ""}
        </div>
      </div>`;
  }).join("");
}

function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

chipsEl.onclick = e => { const b = e.target.closest(".chip"); if(!b) return; filter = b.dataset.c; render(); };
$("#search").oninput = e => { query = e.target.value.trim(); render(); };

listEl.addEventListener("click", e => {
  const fav = e.target.closest("[data-fav]");
  if(fav){
    const id = fav.dataset.fav;
    state.fav = state.fav.includes(id) ? state.fav.filter(x => x !== id) : state.fav.concat(id);
    save(); render(); return;
  }
  const ed = e.target.closest("[data-edit]");
  if(ed){ openSheet(library().find(s => s.id === ed.dataset.edit)); return; }
  const pl = e.target.closest("[data-play]");
  if(pl){
    const s = library().find(x => x.id === pl.dataset.play);
    if(!s) return;
    if(!s.url){ statusEl.textContent = "No stream URL for " + s.n + " — open the listen page."; return; }
    if(insecure(s)){ statusEl.textContent = s.n + " is http-only. Safari blocks it here; use the listen page."; return; }
    tune(s);
  }
});

/* ---------- add / edit ---------- */
const sheet = $("#sheet");
$("#fCat").innerHTML = CATS.map(c => `<option>${c}</option>`).join("");
let editing = null;

function openSheet(s){
  editing = s || null;
  $("#shTitle").textContent = s ? "Edit station" : "Add a station";
  $("#fName").value = s ? s.n : "";
  $("#fUrl").value = s ? s.url : "";
  $("#fSite").value = s && s.site ? s.site : "";
  $("#fPlace").value = s ? s.place : "";
  $("#fCat").value = s ? s.cat : "Other";
  $("#fMsg").textContent = "";
  $("#delRow").hidden = !s;
  sheet.showModal();
}
$("#addBtn").onclick = () => openSheet(null);
$("#fCancel").onclick = () => sheet.close();

$("#fSave").onclick = () => {
  const n = $("#fName").value.trim(), url = $("#fUrl").value.trim();
  if(!n){ $("#fMsg").textContent = "Give it a name."; return; }
  if(!/^https?:\/\//i.test(url)){ $("#fMsg").textContent = "The stream URL needs to start with http:// or https://"; return; }
  if(httpsPage && url.startsWith("http://")) $("#fMsg").textContent = "Saved, but http streams won't play on an https page.";
  const rec = {
    id: editing ? editing.id : "u" + Date.now().toString(36),
    n, url,
    site: $("#fSite").value.trim(),
    place: $("#fPlace").value.trim() || "Added by you",
    cat: $("#fCat").value,
    hls: /\.m3u8(\?|$)/i.test(url),
    custom: true
  };
  state.custom = editing
    ? state.custom.map(s => s.id === rec.id ? rec : s)
    : state.custom.concat(rec);
  save(); render();
  setTimeout(() => sheet.close(), $("#fMsg").textContent ? 1400 : 0);
};

$("#fDelete").onclick = () => {
  if(!editing) return;
  if(editing.custom) state.custom = state.custom.filter(s => s.id !== editing.id);
  else state.hidden = state.hidden.concat(editing.id);
  state.fav = state.fav.filter(x => x !== editing.id);
  save(); render(); sheet.close();
};

/* ---------- export / import ---------- */
const io = $("#ioSheet");
$("#expBtn").onclick = () => {
  $("#ioTitle").textContent = "Export library";
  $("#ioHelp").textContent = "Your added stations, saved marks, and anything you removed. Copy it somewhere safe.";
  $("#ioText").value = JSON.stringify(state, null, 2);
  $("#ioGo").hidden = true; $("#ioMsg").textContent = "";
  io.showModal(); $("#ioText").select();
};
$("#impBtn").onclick = () => {
  $("#ioTitle").textContent = "Import library";
  $("#ioHelp").textContent = "Paste an export. This replaces what's on this phone.";
  $("#ioText").value = ""; $("#ioGo").hidden = false; $("#ioMsg").textContent = "";
  io.showModal();
};
$("#ioClose").onclick = () => io.close();
$("#ioGo").onclick = () => {
  try{
    const d = JSON.parse($("#ioText").value);
    state = {custom:d.custom||[], fav:d.fav||[], hidden:d.hidden||[], last:d.last||null};
    save(); render(); io.close();
  }catch(e){ $("#ioMsg").textContent = "That isn't valid JSON — check for a truncated paste."; }
};

/* ---------- boot ---------- */
render();
setReadout("OFF","standby","", httpsPage
  ? "Pick a station."
  : "Pick a station. Served over http, so every stream here will play.");
</script>
</body>
</html>
