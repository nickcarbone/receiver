<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="no">
<meta name="theme-color" content="#1b1e21">
<title>Receiver</title>

<style>
  :root{
    --shell:#1b1e21; --panel:#252a2e; --panel-hi:#2f353a; --slat:#3a4046;
    --etch:#8d959c; --readout:#e8e4dc; --lamp:#d9a441; --hair:rgba(255,255,255,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--shell);color:var(--readout);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select,textarea{font:inherit}

  .cabinet{position:sticky;top:0;z-index:20;
    background:linear-gradient(#2f353a,#22272b 62%,#1d2124);
    border-bottom:1px solid #14171a;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 8px 22px rgba(0,0,0,.45);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  .cab-row{display:flex;align-items:center;gap:13px}
  .porthole{flex:0 0 92px;height:92px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#33393e,#1a1d20 72%);
    box-shadow:0 0 0 2px #4a5157,0 0 0 3px #16191b,
      inset 0 3px 9px rgba(0,0,0,.75),inset 0 -2px 5px rgba(255,255,255,.05);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:8px;overflow:hidden}
  .p-freq{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;color:var(--etch)}
  .p-name{font:600 13px/1.15 -apple-system,sans-serif;color:var(--readout);margin-top:5px;max-width:76px;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .lamp{width:6px;height:6px;border-radius:50%;background:#3d4348;margin-top:6px;transition:background .25s,box-shadow .25s}
  .lamp.on{background:var(--lamp);box-shadow:0 0 7px 1px rgba(217,164,65,.75)}
  .lamp.warm{background:#7a6234}
  .grille{flex:1;height:92px;border-radius:5px;overflow:hidden;
    display:flex;gap:3px;align-items:flex-end;padding:7px 8px;
    background:linear-gradient(#1c2023,#15181a);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.05)}
  .slat{flex:1;height:26%;background:var(--slat);border-radius:1px;
    transform:skewX(-13deg);transform-origin:bottom;
    transition:height .34s cubic-bezier(.3,.7,.3,1),background .34s}
  .playing .slat{background:#4b535a}
  .cab-meta{display:flex;justify-content:space-between;align-items:baseline;
    margin-top:9px;font-size:12px;color:var(--etch);gap:10px}
  .stopbtn{color:var(--etch);border:1px solid var(--hair);border-radius:20px;padding:3px 12px;font-size:12px}
  .stopbtn:active{background:rgba(255,255,255,.06)}

  .chips{display:flex;gap:7px;overflow-x:auto;padding:9px 14px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chips.sub{padding-top:7px}
  .chip{flex:0 0 auto;padding:6px 13px;border-radius:16px;font-size:13px;
    color:var(--etch);border:1px solid var(--hair);background:rgba(255,255,255,.02);white-space:nowrap}
  .chip[aria-pressed="true"]{color:#141719;background:var(--readout);border-color:var(--readout);font-weight:600}
  .chips.sub .chip[aria-pressed="true"]{background:#4b535a;color:var(--readout);border-color:#5a6167}

  .searchwrap{padding:9px 14px 2px}
  .search{width:100%;padding:9px 12px;border-radius:8px;background:#171a1d;border:1px solid var(--hair);color:var(--readout)}
  .search::placeholder{color:#5f676d}
  .count{padding:6px 16px 0;font-size:11.5px;color:#666e74}

  .list{padding:6px 10px 30px;display:flex;flex-direction:column;gap:6px}
  .st{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;
    background:var(--panel);border:1px solid var(--hair);text-align:left;width:100%}
  .st:active{background:var(--panel-hi)}
  .st.live{border-color:rgba(217,164,65,.5);background:#2c3136}
  .st-body{flex:1;min-width:0}
  .st-name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .st-sub{font-size:12.5px;color:var(--etch);margin-top:2px}
  .st-act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .fav{font-size:16px;line-height:1;color:#464d53;padding:2px 4px}
  .fav.on{color:var(--lamp)}
  .out{font-size:11.5px;color:var(--etch);border:1px solid var(--hair);border-radius:14px;
    padding:4px 9px;text-decoration:none;white-space:nowrap}
  .tag{font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;
    padding:3px 5px;border-radius:3px;background:#3a4046;color:#c3cad0}
  .empty{padding:34px 20px;text-align:center;color:var(--etch);font-size:14px}

  .bar{display:flex;gap:8px;padding:2px 14px 26px;justify-content:center;flex-wrap:wrap}
  .bar button{font-size:12.5px;color:var(--etch);border:1px solid var(--hair);border-radius:16px;padding:6px 13px}
  dialog{border:0;border-radius:14px 14px 0 0;padding:0;width:100%;max-width:520px;
    background:var(--panel);color:var(--readout);margin:auto auto 0}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .sheet{padding:18px 18px calc(20px + env(safe-area-inset-bottom))}
  .sheet h2{font-size:16px;margin:0 0 3px}
  .sheet p{font-size:12.5px;color:var(--etch);margin:0 0 14px}
  .f{display:block;margin-bottom:10px}
  .f span{display:block;font-size:12px;color:var(--etch);margin-bottom:4px}
  .f input,.f select,.f textarea{width:100%;padding:9px 11px;border-radius:8px;
    background:#171a1d;border:1px solid var(--hair);color:var(--readout)}
  .sheet-act{display:flex;gap:9px;margin-top:14px}
  .sheet-act button{flex:1;padding:11px;border-radius:9px;font-weight:600;font-size:14px}
  .save{background:var(--readout);color:#171a1d}
  .cancel{border:1px solid var(--hair);color:var(--etch)}
  .msg{font-size:12.5px;color:var(--lamp);min-height:17px;margin-top:8px}
  @media (prefers-reduced-motion:reduce){.slat{transition:none}}
</style>
</head>
<body>

<div class="cabinet">
  <div class="cab-row">
    <div class="porthole">
      <div class="p-freq" id="pFreq">OFF</div>
      <div class="p-name" id="pName">standby</div>
      <div class="lamp" id="lamp"></div>
    </div>
    <div class="grille" id="grille"></div>
  </div>
  <div class="cab-meta">
    <div id="status">Pick a station.</div>
    <button class="stopbtn" id="stop" hidden>Stop</button>
  </div>
</div>

<div class="chips" id="chipsFormat"></div>
<div class="chips sub" id="chipsRegion"></div>
<div class="searchwrap"><input class="search" id="search" placeholder="Search name, city, or language" autocomplete="off" autocapitalize="off"></div>
<div class="count" id="count"></div>
<div class="list" id="list"></div>

<div class="bar">
  <button id="addBtn">Add a station</button>
  <button id="expBtn">Export</button>
  <button id="impBtn">Import</button>
</div>

<dialog id="sheet"><div class="sheet">
  <h2 id="shTitle">Add a station</h2>
  <p>Paste a direct stream URL — an Icecast or Shoutcast mount, or an .m3u8. A homepage link won't play.</p>
  <label class="f"><span>Name</span><input id="fName" placeholder="Radio Nova"></label>
  <label class="f"><span>Stream URL</span><input id="fUrl" placeholder="https://…" inputmode="url" autocapitalize="off"></label>
  <label class="f"><span>Where to listen on the web (optional)</span><input id="fSite" placeholder="https://…" inputmode="url" autocapitalize="off"></label>
  <label class="f"><span>City and country</span><input id="fPlace" placeholder="Paris, France"></label>
  <label class="f"><span>Language</span><input id="fLang" placeholder="French"></label>
  <label class="f"><span>Format</span><select id="fCat"></select></label>
  <label class="f"><span>Region</span><select id="fReg"></select></label>
  <div class="msg" id="fMsg"></div>
  <div class="sheet-act">
    <button class="cancel" id="fCancel">Cancel</button>
    <button class="save" id="fSave">Save station</button>
  </div>
  <div class="sheet-act" id="delRow" hidden style="margin-top:9px">
    <button class="cancel" id="fDelete" style="color:#c98080">Remove this station</button>
  </div>
</div></dialog>

<dialog id="ioSheet"><div class="sheet">
  <h2 id="ioTitle">Library</h2>
  <p id="ioHelp"></p>
  <label class="f"><textarea id="ioText" rows="9" style="font:12px/1.4 ui-monospace,Menlo,monospace"></textarea></label>
  <div class="msg" id="ioMsg"></div>
  <div class="sheet-act">
    <button class="cancel" id="ioClose">Close</button>
    <button class="save" id="ioGo" hidden>Import</button>
  </div>
</div></dialog>

{id:"gullbylgjan", n:"Gull Bylgjan 90.9", cat:"Desktop only", reg:"Nordics", place:"Reykjavik, Iceland", lang:"Icelandic", url:"http://icecast.365net.is:8000/orbGullBylgjan.aac", site:"https://bylgjan.visir.is/"}];

const CATS = ["Talk","Rock","00s & Retro","Top 40","Forces","Desktop only","Other"];
const REGS = ["Britain","France & Low Countries","Central Europe","Nordics","Baltics","Balkans","Iberia & Med","Beyond Europe","Elsewhere"];
const KEY = "receiver.v2";
const SLATS = 22;

const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};
let state = {custom:[], fav:[], hidden:[]};
try{
  Object.assign(state, JSON.parse(store.get(KEY) || store.get("receiver.v1") || "{}"));
}catch(e){}
state.custom = state.custom || []; state.fav = state.fav || []; state.hidden = state.hidden || [];
const save = () => store.set(KEY, JSON.stringify(state));

const httpsPage = location.protocol === "https:";
const library = () => BUILT.filter(s => !state.hidden.includes(s.id)).concat(state.custom);
const blocked = s => httpsPage && s.url.startsWith("http://");

const $ = s => document.querySelector(s);
const listEl = $("#list"), grille = $("#grille"), countEl = $("#count");
const pFreq = $("#pFreq"), pName = $("#pName"), lamp = $("#lamp"),
      statusEl = $("#status"), stopBtn = $("#stop");

for(let i=0;i<SLATS;i++){ const d=document.createElement("div"); d.className="slat"; grille.appendChild(d); }
const slats = [...document.querySelectorAll(".slat")];

const audio = new Audio();
audio.preload = "none";
let current = null, tries = 0, retryTimer = null, animTimer = null, hls = null;

function setReadout(freq, name, lampState, status){
  pFreq.textContent = freq; pName.textContent = name;
  lamp.className = "lamp" + (lampState ? " " + lampState : "");
  statusEl.textContent = status; stopBtn.hidden = !current;
}
function animate(on){
  clearInterval(animTimer);
  document.body.classList.toggle("playing", on);
  if(!on){ slats.forEach(s => s.style.height = "26%"); return; }
  animTimer = setInterval(() => {
    slats.forEach((s,i) => {
      const base = 34 + 30*Math.sin((Date.now()/380) + i*0.7);
      s.style.height = Math.max(18, Math.min(96, base + Math.random()*26)) + "%";
    });
  }, 190);
}
async function tune(s){
  if(current && current.id === s.id){ stop(); return; }
  stop(true); current = s; tries = 0; render();
  setReadout("TUNING", s.n, "warm", "Connecting to " + s.n + "…");
  await connect();
}
async function connect(){
  const s = current; if(!s) return;
  const native = audio.canPlayType("application/vnd.apple.mpegurl") !== "";
  try{
    if(s.hls && !native){
      await loadHls();
      if(hls) hls.destroy();
      hls = new Hls(); hls.loadSource(s.url); hls.attachMedia(audio);
    }else{ audio.src = s.url; }
    await audio.play(); onLive();
  }catch(err){ onFail(); }
}
function loadHls(){
  if(window.Hls) return Promise.resolve();
  return new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js";
    sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
  });
}
function onLive(){
  const s = current; if(!s) return;
  tries = 0;
  setReadout("ON AIR", s.n, "on", s.place + " · " + s.lang);
  animate(true);
  if("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({title:s.n, artist:s.place, album:"Receiver"});
    navigator.mediaSession.playbackState = "playing";
  }
  render();
}
function onFail(){
  const s = current; if(!s) return;
  tries++; animate(false);
  if(tries <= 4){
    setReadout("RETRY", s.n, "warm", "Stream dropped. Retry " + tries + " of 4…");
    retryTimer = setTimeout(connect, 900 * tries);
  }else{
    setReadout("NO SIG", s.n, "", "Couldn't hold " + s.n + ". Try the listen page.");
    current = null; render();
  }
}
function stop(quiet){
  clearTimeout(retryTimer);
  try{ audio.pause(); audio.removeAttribute("src"); audio.load(); }catch(e){}
  if(hls){ hls.destroy(); hls = null; }
  current = null; animate(false);
  if("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
  if(!quiet){ setReadout("OFF","standby","","Pick a station."); render(); }
}
audio.addEventListener("error", onFail);
audio.addEventListener("ended", () => { if(current) onFail(); });
audio.addEventListener("playing", () => { if(current) onLive(); });
if("mediaSession" in navigator){
  try{
    navigator.mediaSession.setActionHandler("play", () => current && audio.play());
    navigator.mediaSession.setActionHandler("pause", () => stop());
    navigator.mediaSession.setActionHandler("stop", () => stop());
  }catch(e){}
}
stopBtn.onclick = () => stop();

let fCat = "All", fReg = "All", query = "";

function chipRow(el, all, active, key){
  el.innerHTML = ["All", ...all, ...(key==="cat" ? ["Saved"] : [])]
    .map(c => `<button class="chip" data-v="${c}" aria-pressed="${c===active}">${c}</button>`).join("");
}
function matches(s){
  if(fCat === "Saved"){ if(!state.fav.includes(s.id)) return false; }
  else if(fCat !== "All" && s.cat !== fCat) return false;
  if(fReg !== "All" && s.reg !== fReg) return false;
  if(query){
    const q = query.toLowerCase();
    if(!(s.n+" "+s.place+" "+s.lang+" "+s.cat).toLowerCase().includes(q)) return false;
  }
  return true;
}
function render(){
  const lib = library();
  const present = c => lib.some(s => s.cat === c);
  chipRow($("#chipsFormat"), CATS.filter(present), fCat, "cat");
  chipRow($("#chipsRegion"), REGS.filter(r => lib.some(s => s.reg === r)), fReg, "reg");

  const rows = lib.filter(matches).sort((a,b) => {
    const fa = state.fav.includes(a.id), fb = state.fav.includes(b.id);
    if(fa !== fb) return fa ? -1 : 1;
    return a.n.localeCompare(b.n);
  });
  countEl.textContent = rows.length + (rows.length === 1 ? " station" : " stations");

  if(!rows.length){
    listEl.innerHTML = `<div class="empty">Nothing matches. Clear a filter, or add a station of your own.</div>`;
    return;
  }
  listEl.innerHTML = rows.map(s => {
    const live = current && current.id === s.id;
    const tags = [];
    if(s.hls) tags.push(`<span class="tag">HLS</span>`);
    if(s.custom) tags.push(`<span class="tag">MINE</span>`);
    return `<div class="st ${live?"live":""}">
      <div class="st-body" data-play="${s.id}" role="button" tabindex="0">
        <div class="st-name">${esc(s.n)} ${tags.join(" ")}</div>
        <div class="st-sub">${esc(s.place)} · ${esc(s.lang)}</div>
      </div>
      <div class="st-act">
        <button class="fav ${state.fav.includes(s.id)?"on":""}" data-fav="${s.id}" aria-label="Save">★</button>
        ${s.site ? `<a class="out" href="${s.site}" target="_blank" rel="noopener">Listen page</a>` : ""}
        ${s.custom ? `<button class="out" data-edit="${s.id}">Edit</button>` : ""}
      </div></div>`;
  }).join("");
}
function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

$("#chipsFormat").onclick = e => { const b=e.target.closest(".chip"); if(b){ fCat=b.dataset.v; render(); } };
$("#chipsRegion").onclick = e => { const b=e.target.closest(".chip"); if(b){ fReg=b.dataset.v; render(); } };
$("#search").oninput = e => { query = e.target.value.trim(); render(); };

listEl.addEventListener("click", e => {
  const fav = e.target.closest("[data-fav]");
  if(fav){
    const id = fav.dataset.fav;
    state.fav = state.fav.includes(id) ? state.fav.filter(x => x !== id) : state.fav.concat(id);
    save(); render(); return;
  }
  const ed = e.target.closest("[data-edit]");
  if(ed){ openSheet(library().find(s => s.id === ed.dataset.edit)); return; }
  const pl = e.target.closest("[data-play]");
  if(pl){
    const s = library().find(x => x.id === pl.dataset.play);
    if(!s) return;
    if(blocked(s)){ statusEl.textContent = s.n + " runs on your Mac, not here. Open the listen page instead."; return; }
    tune(s);
  }
});

const sheet = $("#sheet");
$("#fCat").innerHTML = CATS.map(c => `<option>${c}</option>`).join("");
$("#fReg").innerHTML = REGS.map(c => `<option>${c}</option>`).join("");
let editing = null;

function openSheet(s){
  editing = s || null;
  $("#shTitle").textContent = s ? "Edit station" : "Add a station";
  $("#fName").value = s ? s.n : "";
  $("#fUrl").value = s ? s.url : "";
  $("#fSite").value = s && s.site ? s.site : "";
  $("#fPlace").value = s ? s.place : "";
  $("#fLang").value = s && s.lang ? s.lang : "";
  $("#fCat").value = s ? s.cat : "Other";
  $("#fReg").value = s ? s.reg : "Elsewhere";
  $("#fMsg").textContent = ""; $("#delRow").hidden = !s;
  sheet.showModal();
}
$("#addBtn").onclick = () => openSheet(null);
$("#fCancel").onclick = () => sheet.close();
$("#fSave").onclick = () => {
  const n = $("#fName").value.trim(), url = $("#fUrl").value.trim();
  if(!n){ $("#fMsg").textContent = "Give it a name."; return; }
  if(!/^https?:\/\//i.test(url)){ $("#fMsg").textContent = "The stream URL needs to start with http:// or https://"; return; }
  let warn = "";
  if(httpsPage && url.startsWith("http://")) warn = "Saved under Desktop only — http streams can't play on an https page.";
  const rec = {
    id: editing ? editing.id : "u" + Date.now().toString(36),
    n, url, site: $("#fSite").value.trim(),
    place: $("#fPlace").value.trim() || "Added by you",
    lang: $("#fLang").value.trim() || "—",
    cat: warn ? "Desktop only" : $("#fCat").value,
    reg: $("#fReg").value,
    hls: /\.m3u8(\?|$)/i.test(url), custom: true
  };
  state.custom = editing ? state.custom.map(s => s.id === rec.id ? rec : s) : state.custom.concat(rec);
  save(); render();
  $("#fMsg").textContent = warn;
  setTimeout(() => sheet.close(), warn ? 1600 : 0);
};
$("#fDelete").onclick = () => {
  if(!editing) return;
  if(editing.custom) state.custom = state.custom.filter(s => s.id !== editing.id);
  else state.hidden = state.hidden.concat(editing.id);
  state.fav = state.fav.filter(x => x !== editing.id);
  save(); render(); sheet.close();
};

const io = $("#ioSheet");
$("#expBtn").onclick = () => {
  $("#ioTitle").textContent = "Export library";
  $("#ioHelp").textContent = "Stations you added, saved marks, and anything you removed. Copy it somewhere safe.";
  $("#ioText").value = JSON.stringify(state, null, 2);
  $("#ioGo").hidden = true; $("#ioMsg").textContent = "";
  io.showModal(); $("#ioText").select();
};
$("#impBtn").onclick = () => {
  $("#ioTitle").textContent = "Import library";
  $("#ioHelp").textContent = "Paste an export. This replaces what's on this phone.";
  $("#ioText").value = ""; $("#ioGo").hidden = false; $("#ioMsg").textContent = "";
  io.showModal();
};
$("#ioClose").onclick = () => io.close();
$("#ioGo").onclick = () => {
  try{
    const d = JSON.parse($("#ioText").value);
    state = {custom:d.custom||[], fav:d.fav||[], hidden:d.hidden||[]};
    save(); render(); io.close();
  }catch(e){ $("#ioMsg").textContent = "That isn't valid JSON — check for a truncated paste."; }
};

render();
setReadout("OFF","standby","", httpsPage ? "Pick a station."
  : "Pick a station. Served over http, so every stream here will play.");
</script>
